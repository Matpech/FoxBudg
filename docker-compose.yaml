services:
  db:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./PostgreSQL:/docker-entrypoint-initdb.d
  api:
    build: ./Backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    ports:
      - 4000:4000
    volumes:
      - files:/data
  
  nginx:
    image: nginx:1.31-alpine3.24
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./Nginx/conf.d.dev:/etc/nginx/conf.d:ro
    depends_on:
      - api

  frontend:
    build:
      context: Frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./Frontend:/app
      - node_modules:/app/node_modules


volumes:
  postgres_data:
  files:
  node_modules: